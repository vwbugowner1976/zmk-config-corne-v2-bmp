# Corne v2 + original BLE Micro Pro (non-boost)
# ZMK v0.3.x

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Corne v2 has 27 SK6812MINI LEDs on each half.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Zephyr 3.5 requires the LED strip core and WS2812 backend to be enabled
# explicitly for worldsemi,ws2812-spi devicetree nodes.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Original BLE Micro Pro + this Corne build is USB powered and does not use
# a ZMK-controlled external-power GPIO for the LED rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
