# Corne v2 + original BLE Micro Pro (non-boost)
# ZMK v0.3.x

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Corne v2 has 27 SK6812MINI LEDs on each half.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Original BLE Micro Pro + this Corne build is USB powered and does not use
# a ZMK-controlled external-power GPIO for the LED rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
