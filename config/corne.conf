# Corne v2 + original BLE Micro Pro (non-boost)
# ZMK v0.3 + DYA Studio extensions

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Corne v2 has 27 SK6812MINI LEDs on each half. The custom Lighting engine
# drives the chosen strip directly, so standard ZMK RGB underglow stays off to
# avoid two animation engines writing the same strip.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Firefly + layer/Bluetooth status lighting.
CONFIG_ZMK_CORNE_LIGHTING=y

# Runtime settings are owned by the central half and exposed through My ZMK
# Studio. The dedicated lighting relay mirrors config/state to the peripheral.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# The stock DYA relay payload is only 14 bytes. Corne lighting sync carries the
# whole compact lighting config plus the current layer/profile state, so give
# the relay enough room for that event.
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=96

CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
